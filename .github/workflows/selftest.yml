name: selftest

# Every push and pull request: run each tool's selftest (synthetic data, no
# hardware) and the regression library. The library's real recordings are not
# in the repository, so its cases are skipped here unless a data folder is made
# available (HULC_REGRESS_DATA); run it locally against the lab copy before
# merging a change to the analysis.

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy
      - name: Selftests
        run: |
          set -e
          python tools/reconcile_nodes.py --selftest
          python tools/motion_capabilities.py --selftest
          python tools/calibrate_segments.py selftest
          python tools/metrics.py selftest
          python tools/skeleton_viewer.py selftest
          python tools/analyze_session.py selftest
          python tools/opensense_ik.py selftest
          python tools/multinode_test.py selftest
          python tools/regress.py selftest
      - name: Regression library (skips cases without recordings)
        run: python tools/regress.py run
